name: Build Native ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Dependencies (Native ARM64)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libfreetype6-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libexpat1-dev \
            libxcb-composite0-dev \
            libssl-dev \
            libx11-dev

      - name: Build Neovide (Release)
        run: |
          cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: neovide-arm64-native
          path: target/release/neovide
